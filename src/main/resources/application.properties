# BASE DE DONNÉES POSTGRESQL (Sécurisée) 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ENVOI D'E-MAILS VIA MAILJET API HTTP
mailjet.api.key=${MAILJET_API_KEY}
mailjet.secret.key=${MAILJET_SECRET_KEY}
mail.from=${MAIL_FROM}

# Neon ferme les connexions inactives après 5 min — on limite à 3 min
spring.datasource.hikari.maxLifetime=180000
spring.datasource.hikari.keepaliveTime=60000